<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Creative Work</title>

    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/themes.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <link rel="stylesheet" href="./bookshelf.css">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Fun Stuff :) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Navigation Bar -->
    <load src="src/partials/navbar.html" />

    <main class="main-container">

        <div class="shelf-wrapper">
            <!-- Category Selection -->
             <div class="category-select-wrapper">
                <select id="category-select" class="category-dropdown" aria-label="Kategorie auswählen">
                    <option value="ShortStories" data-display-name="Kurzgeschichten" selected>
                    Kurzgeschichten
                    </option>
                    <option value="DetectiveRonny" data-display-name="Detektiv Ronny">
                    Detektiv Ronny
                    </option>
                    <option value="AgentBullet" data-display-name="Agent Bullet">
                    Agent Bullet
                    </option>
                    <option value="Poems" data-display-name="Gedichte">
                    Gedichte
                    </option>
                </select>
            </div>

            <!-- Book Scroller -->
            <div class="shelf-carousel-container">
                <button id="shelf-prev" class="shelf-arrow" aria-label="Vorheriges Buch">‹</button>

                <div id="selected-shelf" class="shelf-scroller">
                    <div id="shelf-track" class="shelf-track">
                        <!-- books get inserted here by Code -->
                    </div>
                </div>

                <button id="shelf-next" class="shelf-arrow" aria-label="Nächstes Buch">›</button>
            </div>

            <div id="book-info"></div>
        </div>

    </main>

    <!-- Socials -->
    <load src="/src/partials/footer.html" />

    <script type="module" src="/src/js/themes.js"></script>
    <script type="module" src="./bookshelf.ts"></script>

</body>
</html>
